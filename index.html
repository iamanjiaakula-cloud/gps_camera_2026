<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>GPS Camera</title>
<style>
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#000;color:#fff;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
#cam{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;background:#000}
#info{position:fixed;left:8px;right:8px;bottom:calc(124px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;align-items:flex-end}
#mapv{width:84px;height:84px;border-radius:8px;background:#222;flex:none}
#txt{flex:1;min-width:0;padding:8px 10px;border-radius:10px;background:rgba(0,0,0,.55);backdrop-filter:blur(4px);line-height:1.3;font-size:clamp(11px,3vw,14px);max-height:34vh;overflow:hidden}
#txt .h{font-size:1.3em;font-weight:700}
#txt .dim{opacity:.85}
#bar{position:fixed;left:0;right:0;bottom:0;height:calc(116px + env(safe-area-inset-bottom,0px));padding-bottom:env(safe-area-inset-bottom,0px);display:flex;align-items:center;justify-content:space-around;background:rgba(0,0,0,.7)}
button{font:inherit;color:inherit;border:0;cursor:pointer}
#shot{width:74px;height:74px;border-radius:50%;background:#fff;border:5px solid #000;outline:3px solid #fff;transition:transform .08s}
#shot:active{transform:scale(.9)}
#shot:disabled{opacity:.4}
.side{width:52px;height:52px;border-radius:50%;background:#2a2a2a;font-size:22px;display:grid;place-items:center;overflow:hidden}
#last{background-size:cover;background-position:center}
#status{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));left:10px;right:10px;text-align:center;font-size:13px}
#status span{display:inline-block;padding:5px 12px;border-radius:99px;background:rgba(0,0,0,.6)}
#view{position:fixed;inset:0;background:#000;display:none;flex-direction:column}
#view.on{display:flex}
#view img{flex:1;min-height:0;width:100%;object-fit:contain}
#view .acts{display:flex;gap:10px;padding:12px;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px))}
#view .acts button{flex:1;padding:14px;border-radius:10px;background:#2a2a2a;font-weight:600}
#view .acts button.pri{background:#1fa971;color:#fff}
#err{position:fixed;inset:0;display:none;place-items:center;text-align:center;padding:30px;background:#000;line-height:1.5}
#err.on{display:grid}
</style>
</head>
<body>
<video id="cam" autoplay playsinline muted></video>
<div id="status"><span id="st">Getting location…</span></div>

<div id="info">
  <canvas id="mapv" width="168" height="168"></canvas>
  <div id="txt"></div>
</div>

<div id="bar">
  <button class="side" id="last" aria-label="View last photo">🖼</button>
  <button id="shot" aria-label="Take photo"></button>
  <button class="side" id="flip" aria-label="Switch camera">🔄</button>
</div>

<div id="view">
  <img id="prev" alt="Captured photo">
  <div class="acts">
    <button id="retake">Retake</button>
    <button id="share">Share</button>
    <button class="pri" id="save">Save</button>
  </div>
</div>

<div id="err"><div id="errmsg"></div></div>

<script>
const $ = id => document.getElementById(id);
const cam = $('cam'), shot = $('shot');
let stream, facing = 'environment', pos = null, lastGeo = null, geoBusy = false, blob = null, fname = '';
let mapImg = null;
let addr = { area: '—', district: '—', state: '—', pincode: '—', city: '—', street: '—', country: '' };

const DAYS = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const pad = n => String(n).padStart(2, '0');
const ok = v => v && v !== '—';

/* ---------- Plus code (Open Location Code, same as Google) ---------- */
function plusCode(lat, lng) {
  const A = '23456789CFGHJMPQRVWX';
  let la = Math.floor((lat + 90) * 40000), lo = Math.floor((lng + 180) * 32000);
  const grid = A[(la % 5) * 4 + (lo % 4)];
  la = Math.floor(la / 5); lo = Math.floor(lo / 4);
  let pairs = '';
  for (let i = 0; i < 5; i++) { pairs = A[la % 20] + A[lo % 20] + pairs; la = Math.floor(la / 20); lo = Math.floor(lo / 20); }
  return (pairs.slice(2, 8) + '+' + pairs.slice(8) + grid);   // short form, e.g. C4HJ+PVW
}

/* ---------- Text lines ---------- */
function now() {
  const d = new Date(), h = d.getHours(), off = -d.getTimezoneOffset(), a = Math.abs(off);
  return {
    d,
    time: pad(h % 12 || 12) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds()) + ' ' + (h < 12 ? 'AM' : 'PM'),
    date: pad(d.getDate()) + '/' + pad(d.getMonth() + 1) + '/' + d.getFullYear(),
    day: DAYS[d.getDay()],
    tz: 'GMT ' + (off < 0 ? '-' : '+') + pad(Math.floor(a / 60)) + ':' + pad(a % 60)
  };
}
function lines() {
  const n = now();
  const code = pos ? plusCode(pos.latitude, pos.longitude) : '—';
  const lat = pos ? pos.latitude.toFixed(6) : '—', lon = pos ? pos.longitude.toFixed(6) : '—';
  const title = [addr.city, addr.state, addr.country].filter(ok).join(', ') || 'Locating…';
  const full = [ok(code) ? 'Plus code: ' + code : '', addr.area, addr.city, (ok(addr.state) ? addr.state : '') + (ok(addr.pincode) ? ' ' + addr.pincode : ''), addr.country]
    .map(s => (s || '').trim()).filter(ok).join(', ');
  return {
    n, title, full,
    fields: 'Street: ' + addr.street + ' | Area: ' + addr.area + ' | District: ' + addr.district + ' | State: ' + addr.state + ' | Pincode: ' + addr.pincode,
    coords: 'Lat ' + lat + '° Long ' + lon + '°',
    when: n.day + ', ' + n.date + ' ' + n.time + ' ' + n.tz
  };
}
function render() {
  const L = lines();
  const e = s => s.replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
  $('txt').innerHTML = '<div class="h">' + e(L.title) + '</div><div>' + e(L.full) + '</div><div class="dim">' + e(L.fields) + '</div><div>' + e(L.coords) + '</div><div>' + e(L.when) + '</div>';
}
setInterval(render, 1000); render();

/* ---------- Map thumbnail (satellite tiles, pin at your position) ---------- */
const SOURCES = [
  (z, x, y) => 'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/' + z + '/' + y + '/' + x,
  (z, x, y) => 'https://tile.openstreetmap.org/' + z + '/' + x + '/' + y + '.png'
];
const loadImg = u => new Promise(r => { const i = new Image(); i.crossOrigin = 'anonymous'; i.onload = () => r(i); i.onerror = () => r(null); i.src = u; });
async function loadMap(lat, lon) {
  const z = 16, n = 2 ** z;
  const px = (lon + 180) / 360 * n;
  const py = (1 - Math.log(Math.tan(lat * Math.PI / 180) + 1 / Math.cos(lat * Math.PI / 180)) / Math.PI) / 2 * n;
  const tx = Math.floor(px), ty = Math.floor(py);
  for (const src of SOURCES) {
    const jobs = [];
    for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) jobs.push(loadImg(src(z, tx + dx, ty + dy)));
    const imgs = await Promise.all(jobs);
    if (imgs.some(i => !i)) continue;
    const big = document.createElement('canvas'); big.width = big.height = 768;
    const g = big.getContext('2d');
    imgs.forEach((im, k) => g.drawImage(im, (k % 3) * 256, Math.floor(k / 3) * 256));
    const cx = 256 + (px - tx) * 256, cy = 256 + (py - ty) * 256, S = 384;
    const c = document.createElement('canvas'); c.width = c.height = S;
    const x = c.getContext('2d');
    x.drawImage(big, cx - S / 2, cy - S / 2, S, S, 0, 0, S, S);
    // pin
    const m = S / 2;
    x.fillStyle = '#e53935'; x.strokeStyle = '#fff'; x.lineWidth = 3;
    x.beginPath(); x.arc(m, m - 34, 20, Math.PI * 0.8, Math.PI * 2.2); x.lineTo(m, m); x.closePath(); x.fill(); x.stroke();
    x.fillStyle = '#fff'; x.beginPath(); x.arc(m, m - 34, 7, 0, 7); x.fill();
    x.fillStyle = 'rgba(255,255,255,.8)'; x.font = '12px sans-serif'; x.fillText(src === SOURCES[0] ? '© Esri' : '© OpenStreetMap', 6, S - 6);
    mapImg = c;
    const v = $('mapv').getContext('2d'); v.drawImage(c, 0, 0, 168, 168);
    return;
  }
}

/* ---------- Camera ---------- */
async function startCam() {
  if (stream) stream.getTracks().forEach(t => t.stop());
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: facing }, width: { ideal: 1920 }, height: { ideal: 1080 } }, audio: false
    });
    cam.srcObject = stream;
    cam.style.transform = facing === 'user' ? 'scaleX(-1)' : 'none';
    $('err').classList.remove('on');
  } catch (e) {
    $('errmsg').innerHTML = '<h2>Camera blocked</h2><p>Allow camera access in your browser settings, then reload this page.</p>';
    $('err').classList.add('on');
  }
}
$('flip').onclick = () => { facing = facing === 'user' ? 'environment' : 'user'; startCam(); };

/* ---------- Location ---------- */
function dist(a, b, c, d) {
  const R = 6371000, r = x => x * Math.PI / 180;
  const h = Math.sin(r(c - a) / 2) ** 2 + Math.cos(r(a)) * Math.cos(r(c)) * Math.sin(r(d - b) / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(h));
}
async function reverse(lat, lon) {
  if (geoBusy) return;
  geoBusy = true;
  loadMap(lat, lon);
  try {
    const r = await fetch('https://nominatim.openstreetmap.org/reverse?format=jsonv2&addressdetails=1&accept-language=en&zoom=18&lat=' + lat + '&lon=' + lon);
    const a = (await r.json()).address || {};
    const street = [a.house_number, a.road || a.pedestrian || a.footway || a.path].filter(Boolean).join(' ');
    addr = {
      area: a.suburb || a.neighbourhood || a.village || a.hamlet || a.town || a.city_district || a.city || '—',
      district: a.state_district || a.county || a.city || '—',
      state: a.state || '—',
      pincode: a.postcode || '—',
      city: a.city || a.town || a.village || a.state_district || a.county || '—',
      street: street || '—',
      country: a.country || ''
    };
    lastGeo = { lat, lon };
    $('st').textContent = '📍 Location locked';
    render();
  } catch (e) {
    $('st').textContent = 'Address unavailable (check internet)';
  }
  geoBusy = false;
}
function startGeo() {
  if (!navigator.geolocation) { $('st').textContent = 'GPS not supported'; return; }
  navigator.geolocation.watchPosition(p => {
    pos = p.coords;
    $('st').textContent = '📍 GPS ±' + Math.round(pos.accuracy) + ' m';
    if (!lastGeo || dist(lastGeo.lat, lastGeo.lon, pos.latitude, pos.longitude) > 40) reverse(pos.latitude, pos.longitude);
    render();
  }, e => {
    $('st').textContent = e.code === 1 ? 'Location permission denied' : 'Cannot get location';
  }, { enableHighAccuracy: true, maximumAge: 5000, timeout: 20000 });
}

/* ---------- Capture ---------- */
function wrap(x, text, maxW) {
  const words = text.split(' '), out = []; let cur = '';
  for (const w of words) {
    const t = cur ? cur + ' ' + w : w;
    if (x.measureText(t).width > maxW && cur) { out.push(cur); cur = w; } else cur = t;
  }
  if (cur) out.push(cur);
  return out;
}
shot.onclick = () => {
  if (!cam.videoWidth) return;
  const w = cam.videoWidth, h = cam.videoHeight;
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const x = c.getContext('2d');
  x.drawImage(cam, 0, 0, w, h);

  const L = lines(), fs = Math.max(14, Math.round(Math.min(w, h) * 0.028));
  const m = fs * 0.6, ms = fs * 7.5, p = fs * 0.7, tw = w - m * 3 - ms - p * 2;
  const F = (sz, b) => (b ? '700 ' : '500 ') + sz + 'px system-ui,sans-serif';
  const rows = [];
  x.font = F(fs * 1.35, 1); wrap(x, L.title, tw).forEach(t => rows.push([t, fs * 1.35, 1]));
  x.font = F(fs); [L.full, L.fields, L.coords, L.when].forEach(s => wrap(x, s, tw).forEach(t => rows.push([t, fs, 0])));
  const textH = rows.reduce((s, r) => s + r[1] * 1.35, 0) + p * 2;
  const panelH = Math.max(textH, ms), px = m * 2 + ms, py = h - m - panelH;

  x.fillStyle = 'rgba(0,0,0,.6)';
  x.beginPath(); x.roundRect(px, py, w - m - px, panelH, fs * 0.5); x.fill();
  if (mapImg) { x.save(); x.beginPath(); x.roundRect(m, h - m - ms, ms, ms, fs * 0.4); x.clip(); x.drawImage(mapImg, m, h - m - ms, ms, ms); x.restore(); }
  x.fillStyle = '#fff'; x.textBaseline = 'top';
  let y = py + (panelH - textH) / 2 + p;
  rows.forEach(r => { x.font = F(r[1], r[2]); x.fillText(r[0], px + p, y); y += r[1] * 1.35; });

  const d = L.n.d;
  fname = 'GPS_' + d.getFullYear() + pad(d.getMonth() + 1) + pad(d.getDate()) + '_' + pad(d.getHours()) + pad(d.getMinutes()) + pad(d.getSeconds()) + '.jpg';
  shot.disabled = true;
  c.toBlob(b => {
    blob = b;
    const url = URL.createObjectURL(b);
    $('prev').src = url;
    $('last').style.backgroundImage = 'url(' + url + ')';
    $('last').textContent = '';
    $('view').classList.add('on');
    shot.disabled = false;
  }, 'image/jpeg', 0.92);
};
$('last').onclick = () => { if (blob) $('view').classList.add('on'); };
$('retake').onclick = () => $('view').classList.remove('on');
$('save').onclick = () => {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = fname; a.click();
};
$('share').onclick = async () => {
  const f = new File([blob], fname, { type: 'image/jpeg' });
  if (navigator.canShare && navigator.canShare({ files: [f] })) {
    try { await navigator.share({ files: [f], title: 'GPS Photo' }); } catch (e) {}
  } else $('save').onclick();
};

startCam(); startGeo();
</script>
</body>
</html>
